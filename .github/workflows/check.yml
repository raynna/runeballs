name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lupa
      - run: python tests/test_runeballs.py
      - run: python tests/test_flight_games.py
      - run: python tools/package_runeballs.py
      - uses: actions/upload-artifact@v4
        with:
          name: player-zip
          path: dist/*.zip
